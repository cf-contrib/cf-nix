openapi: 3.0.0
info:
  title: cf-nix-cache
  license:
    name: MIT
  description: |-
    A Nix binary cache on Cloudflare Workers and R2. Reads are public. Uploads
    need an OIDC token from an issuer the Worker trusts, as the password of
    HTTP Basic credentials.

    Errors are JSON, `{ error, message }`. A request that doesn't fit
    this document (a body over the size limit, the wrong content type) is
    rejected before it reaches the Worker, as `application/problem+json`.
  version: v1
tags:
  - name: CacheService
    description: The Nix binary cache protocol.
paths:
  /:
    post:
      operationId: postMassQuery
      summary: Mass query
      description: |-
        Takes a newline-separated list of store path hashes and returns the
        ones that are in the cache, so a client can check many at once.
      parameters: []
      responses:
        '200':
          description: The cached subset of the hashes, one per line.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: |-
            The auth config, the bindings or the signing key are invalid
            (`misconfigured`), or a stored object is unreadable (`internal_error`).
            Details go only to the logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - CacheService
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
  /nar/{hash}.nar:
    head:
      operationId: headNar
      summary: Check for a NAR
      description: Lets an uploader skip NARs the cache already has.
      parameters:
        - name: hash
          in: path
          required: true
          description: The NAR's file hash, from the narinfo's `URL`.
          schema:
            type: string
      responses:
        '200':
          description: The NAR exists.
        '404':
          description: No such NAR.
        '500':
          description: The bucket couldn't be read.
      tags:
        - CacheService
    get:
      operationId: getNar
      summary: Get a NAR
      description: The NAR archive a narinfo's `URL` points at.
      parameters:
        - name: hash
          in: path
          required: true
          description: The NAR's file hash, from the narinfo's `URL`.
          schema:
            type: string
      responses:
        '200':
          description: The NAR.
          content:
            application/x-nix-archive:
              schema:
                type: string
                format: binary
        '404':
          description: No such object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |-
            The auth config, the bindings or the signing key are invalid
            (`misconfigured`), or a stored object is unreadable (`internal_error`).
            Details go only to the logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - CacheService
    put:
      operationId: putNar
      summary: Upload a NAR
      description: |-
        Stores a NAR archive. Compressed NARs aren't supported: upload with
        `?compression=none`.
      parameters:
        - name: hash
          in: path
          required: true
          description: The NAR's file hash, from the narinfo's `URL`.
          schema:
            type: string
      responses:
        '200':
          description: The NAR was stored.
        '401':
          description: |-
            Missing or invalid credentials: no token, a token from an issuer the
            Worker doesn't trust, or one for another audience or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A valid token that no claim set for its issuer allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |-
            The auth config, the bindings or the signing key are invalid
            (`misconfigured`), or a stored object is unreadable (`internal_error`).
            Details go only to the logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The token's issuer, its discovery document or its keys, couldn't be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - CacheService
      requestBody:
        required: true
        content:
          application/x-nix-nar:
            schema:
              type: string
              format: binary
      security:
        - basic: []
  /nix-cache-info:
    get:
      operationId: getNixCacheInfo
      summary: Cache metadata
      description: The store directory, priority and mass-query support, in the format Nix reads.
      parameters: []
      responses:
        '200':
          description: The cache's metadata.
          content:
            text/x-nix-cache-info:
              schema:
                type: string
      tags:
        - CacheService
  /{hash}.narinfo:
    head:
      operationId: headNarInfo
      summary: Check for a narinfo
      description: Lets an uploader skip store paths the cache already has.
      parameters:
        - name: hash
          in: path
          required: true
          description: The hash part of a store path.
          schema:
            type: string
      responses:
        '200':
          description: The narinfo exists.
        '404':
          description: No such narinfo.
        '500':
          description: The bucket couldn't be read.
      tags:
        - CacheService
    get:
      operationId: getNarInfo
      summary: Get a narinfo
      description: |-
        The narinfo for a store path, as it was uploaded, with a `Sig:` line if
        the Worker signed it.
      parameters:
        - name: hash
          in: path
          required: true
          description: The hash part of a store path.
          schema:
            type: string
      responses:
        '200':
          description: The narinfo.
          content:
            text/x-nix-narinfo:
              schema:
                type: string
        '404':
          description: No such object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |-
            The auth config, the bindings or the signing key are invalid
            (`misconfigured`), or a stored object is unreadable (`internal_error`).
            Details go only to the logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - CacheService
    put:
      operationId: putNarInfo
      summary: Upload a narinfo
      description: |-
        Parses and validates the narinfo, and requires its `StorePath` to match
        the hash. It is stored as sent. If it has no `Sig:`, the Worker signs it
        with `CF_NIX_CACHE_API_SECRET`, and rejects it when no key is set.
      parameters:
        - name: hash
          in: path
          required: true
          description: The hash part of a store path.
          schema:
            type: string
      responses:
        '200':
          description: The narinfo was stored.
        '400':
          description: The narinfo or request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Missing or invalid credentials: no token, a token from an issuer the
            Worker doesn't trust, or one for another audience or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A valid token that no claim set for its issuer allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |-
            The auth config, the bindings or the signing key are invalid
            (`misconfigured`), or a stored object is unreadable (`internal_error`).
            Details go only to the logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The token's issuer, its discovery document or its keys, couldn't be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - CacheService
      requestBody:
        required: true
        content:
          text/x-nix-narinfo:
            schema:
              type: string
      security:
        - basic: []
components:
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: What went wrong. Nix prints it when an upload fails.
      description: An error, `{ error, message }`.
    ErrorCode:
      type: string
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - misconfigured
        - internal_error
        - upstream_error
  securitySchemes:
    basic:
      type: http
      scheme: Basic
      description: |-
        An OIDC token from an issuer the Worker trusts, as the password. The
        username isn't read.
