[package]
name = "cf-nix-api"
version = "0.7.0"
edition = "2021"
authors = ["iamralch"]

[lib]
crate-type = ["cdylib"]

[dependencies]
http-auth-basic = "0.3.7"
# `http` hands `fetch` an http::Request, which the SDK's axum router takes.
worker = { version = "0.8", features = ["http", "axum"] }
worker-macros = { version = "0.8" }

# The API: its types, and the traits and router the Worker implements.
cf-nix-sdk = { path = "../cf-nix-sdk", features = ["server", "signing"] }
# Named by the generated traits and router; the versions the SDK builds with.
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"] }
bytes = "1"
# Reads and discards the body of a refused upload; see the auth middleware.
http-body-util = "0.1"
# The auth layer: a tower Layer and Service over the API's routes.
tower-layer = "0.3"
tower-service = "0.3"

# Verifies upload tokens: their providers, keys and claim sets, through
# WebCrypto. From cf-sts's release on GitHub: it isn't published
# to crates.io.
cf-sts-core = { git = "https://github.com/cf-contrib/cf-sts", tag = "v0.14.0" }

# The provider list. Already in the tree via `worker`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The integration tests call the Worker through the SDK's client.
cf-nix-sdk = { path = "../cf-nix-sdk", features = ["client"] }
reqwest = "0.13.4"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync"] }
# A stand-in OIDC issuer for the integration tests: it serves discovery and a
# JWKS over axum, and signs RS256 tokens with a key made from a fixed seed.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# 0.3: rsa 0.9 takes rand_core 0.6's CryptoRngCore, which later rand_chachas
# don't implement.
rand_chacha = "0.3"
rsa = { version = "0.9", features = ["sha2"] }
# Encodes the stand-in issuer's tokens and keys.
base64 = "0.23.0"

[features]
# Opt-in integration tests which require `wrangler dev` running locally.
integration = []
