name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      # The OpenAPI document is compiled from TypeSpec and checked in, so it
      # must be what the .tsp compiles to.
      - name: Check OpenAPI Document
        working-directory: crates/cf-nix-cache-sdk/openapi
        run: |
          nix develop --command npm ci
          nix develop --command npm run generate
          git diff --exit-code .
      - name: Run Tests
        run: nix develop --command cargo test
      # The Worker under wrangler dev, on a port and storage of its own, against
      # the tests' stand-in OIDC issuer.
      - name: Run Integration Tests
        run: nix develop --command crates/cf-nix-cache-api/tests/run.sh
      - name: Validate Terraform Module
        working-directory: deployment/terraform
        run: |
          nix develop --command tofu fmt -check -recursive
          nix develop --command tofu init -backend=false
          nix develop --command tofu validate
          nix develop --command tofu test

  release:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main
  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Build with Nix
        working-directory: crates/cf-nix-cache-api
        run: nix develop -c worker-build --release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            crates/cf-nix-cache-api/build/index.js
            crates/cf-nix-cache-api/build/index_bg.wasm
