name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Run Tests
        run: nix develop --command cargo test
      - name: Test Action
        working-directory: packages/cf-nix-cache
        run: nix develop --command npm test
      - name: Validate Terraform Module
        working-directory: packages/cf-nix-cache-api/terraform
        run: |
          nix develop --command tofu fmt -check -recursive
          nix develop --command tofu init -backend=false
          nix develop --command tofu validate
          nix develop --command tofu test

  # Runs the action from a fresh checkout with nothing installed, against a stub
  # that stands in for the runner's OIDC endpoint and the cache's /v1/whoami.
  # Catches broken action.yml paths, and checks that the token refresher keeps
  # running into later steps.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Start Stub
        run: |
          node packages/cf-nix-cache/test/stub.js > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do grep -q listening "$RUNNER_TEMP/stub.log" && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1
      - name: Run cf-nix-cache
        id: auth
        uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:8787/oidc?api-version=2.0
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: stub-request-token
          CF_NIX_ACTION_REFRESH_INTERVAL: "2"
        with:
          cache-url: http://127.0.0.1:8787
      - name: Check Outputs And Netrc
        env:
          SUBJECT: ${{ steps.auth.outputs.subject }}
          NETRC: ${{ steps.auth.outputs.netrc-file }}
        run: |
          test "$SUBJECT" = repo:example-org/app:ref:refs/heads/main
          test "$NIX_CONFIG" = "netrc-file = $NETRC"
          test "$(stat -c %a "$NETRC")" = 600
          grep -q '^  login actions$' "$NETRC"
      - name: Check The Refresher Outlives Its Step
        env:
          NETRC: ${{ steps.auth.outputs.netrc-file }}
        run: |
          first=$(cat "$NETRC")
          sleep 5
          test "$(cat "$NETRC")" != "$first"

  release:
    needs: [test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main
  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Build with Nix
        working-directory: packages/cf-nix-cache-api
        run: nix develop -c worker-build --release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            packages/cf-nix-cache-api/build/index.js
            packages/cf-nix-cache-api/build/index_bg.wasm
