name: cf-nix-cache
description: Authenticate Nix uploads to a cf-nix-cache with the job's GitHub OIDC token
author: cf-contrib
branding:
  icon: upload-cloud
  color: orange
inputs:
  cache-url:
    required: true
    description: Cache base URL, e.g. https://cf-nix-cache.example.workers.dev
  audience:
    required: false
    description: OIDC audience; must equal the Worker's CF_NIX_WORKER_GITHUB_OIDC_AUDIENCE. Defaults to the origin of cache-url.
  refresh:
    required: false
    default: "true"
    description: Keep the token fresh for the rest of the job, so uploads longer than GitHub's 5-minute token lifetime work.
outputs:
  subject:
    description: The identity the cache resolved the token to (the OIDC sub claim)
  netrc-file:
    description: Path of the netrc file, also set as netrc-file in NIX_CONFIG
runs:
  using: node24
  main: action/src/main.js
  post: action/src/post.js
